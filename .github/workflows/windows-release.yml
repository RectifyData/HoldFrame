name: HoldFrame Windows prerelease
on:
  push:
    branches: [windows]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Run shared core tests
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/tests | Out-Null
          $src = @(Get-ChildItem core/src/main/java/dev/rectifydata/holdframe/core -Filter *.java | ForEach-Object { $_.FullName })
          $src += @(Get-ChildItem core/src/test/java/dev/rectifydata/holdframe/core -Filter *.java | ForEach-Object { $_.FullName })
          & javac --release 17 -d build/tests @src
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($test in @("CoreTest", "MediaCoreTest", "SequenceClipboardTest")) {
            & java -cp build/tests ("dev.rectifydata.holdframe.core." + $test)
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Compile Windows app
        shell: pwsh
        run: ./build.ps1
      - name: Run export tests
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/export-tests | Out-Null
          $sources = @(Get-ChildItem desktop/src/test/java/dev/rectifydata/holdframe/windows -Filter ExportSupportTest.java | ForEach-Object { $_.FullName })
          & javac --release 17 -cp build/classes -d build/export-tests @sources
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & java -Djava.awt.headless=true -cp "build/classes;build/export-tests" dev.rectifydata.holdframe.windows.ExportSupportTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate original application icon
        shell: pwsh
        run: |
          python -m pip install pillow
          python tools/generate_icon.py
      - name: Package Windows application with included Java runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          & jpackage --type app-image --name HoldFrame --input dist --main-jar HoldFrame.jar --main-class dev.rectifydata.holdframe.windows.HoldFrame --dest packaged --app-version "0.5.${{ github.run_number }}" --vendor RectifyData --icon assets/HoldFrame.ico
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item dist/HoldFrame.jar release/HoldFrame.jar
      - name: Install NSIS build dependency
        shell: pwsh
        run: |
          $nsis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (-not (Test-Path $nsis)) { choco install nsis -y --no-progress }
          if (-not (Test-Path $nsis)) { throw "NSIS not found" }
      - name: Build visible Windows setup
        shell: pwsh
        run: |
          $nsis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          Push-Location installers
          & $nsis "windows.nsi"
          $status = $LASTEXITCODE
          Pop-Location
          if ($status -ne 0) { exit $status }
      - uses: actions/upload-artifact@v4
        with:
          name: HoldFrame-Windows
          path: release/*
      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $assets = @(Get-ChildItem release -File | ForEach-Object { $_.FullName })
          & gh release create "windows-v0.5.${{ github.run_number }}" @assets --target "$env:GITHUB_SHA" --title "HoldFrame Windows export preview ${{ github.run_number }}" --notes "Interactive Windows installer with progress and launch-on-finish, plus a cross-platform Java JAR. Desktop exporting to MP4 with audio (FFmpeg), animated GIF, PNG pose-sequence ZIP, sprite sheets and still PNGs. Editable font text, four-corner transforms, imported images, timeline audio, Shift-select sequence copy/paste, auto-scrolling and onion skins. Preview build." --prerelease
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
