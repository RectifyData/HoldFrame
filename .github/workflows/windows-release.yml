name: HoldFrame Windows installer CI
on:
  push:
    branches: [windows]
  workflow_dispatch:
permissions:
  contents: write
  issues: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Run shared core tests
        id: core
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/tests | Out-Null
          $src = @(Get-ChildItem core/src/main/java/dev/rectifydata/holdframe/core -Filter *.java | ForEach-Object { $_.FullName })
          $src += @(Get-ChildItem core/src/test/java/dev/rectifydata/holdframe/core -Filter *.java | ForEach-Object { $_.FullName })
          & javac --release 17 -d build/tests @src
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($test in @("CoreTest", "MediaCoreTest", "SequenceClipboardTest", "PressureStrokeTest")) {
            & java -cp build/tests ("dev.rectifydata.holdframe.core." + $test)
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Compile Windows app
        id: compile
        shell: pwsh
        run: ./build.ps1
      - name: Run export tests
        id: tests
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/export-tests | Out-Null
          $sources = @(Get-ChildItem desktop/src/test/java/dev/rectifydata/holdframe/windows -Filter ExportSupportTest.java | ForEach-Object { $_.FullName })
          & javac --release 17 -cp build/classes -d build/export-tests @sources
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & java -Djava.awt.headless=true -cp "build/classes;build/export-tests" dev.rectifydata.holdframe.windows.ExportSupportTest 2>&1 | Tee-Object -FilePath export-tests.log
          $status = $LASTEXITCODE
          if ($status -ne 0) { throw "Export tests failed, see export-tests.log, exit code $status" }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate original application icon
        shell: pwsh
        run: |
          python -m pip install pillow
          python tools/generate_icon.py
      - name: Package Windows application with included Java runtime
        id: package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          New-Item -ItemType Directory -Force build/version-meta/META-INF | Out-Null
          Set-Content -Path build/version-meta/META-INF/holdframe-version.txt -Value "0.12.${{ github.run_number }}" -Encoding ascii
          & jar --update --file dist/HoldFrame.jar -C build/version-meta META-INF/holdframe-version.txt
          if ($LASTEXITCODE -ne 0) { throw "Unable to stamp desktop version" }
          & jpackage --type app-image --name HoldFrame --input dist --main-jar HoldFrame.jar --main-class dev.rectifydata.holdframe.windows.HoldFrame --dest packaged --app-version "0.12.${{ github.run_number }}" --vendor RectifyData --icon assets/HoldFrame.ico
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install NSIS build dependency
        shell: pwsh
        run: |
          $nsis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (-not (Test-Path $nsis)) { choco install nsis -y --no-progress }
          if (-not (Test-Path $nsis)) { throw "NSIS not found" }
      - name: Build visible Windows setup
        id: setup
        shell: pwsh
        run: |
          $nsis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          Push-Location installers
          & $nsis "windows.nsi"
          $status = $LASTEXITCODE
          Pop-Location
          if ($status -ne 0) { exit $status }
      - name: Report failed Windows build
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $url = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          $message = "Windows release failed at commit $env:GITHUB_SHA. Run: $url. Core=${{ steps.core.outcome }}, Compile=${{ steps.compile.outcome }}, ExportTests=${{ steps.tests.outcome }}, Package=${{ steps.package.outcome }}, Setup=${{ steps.setup.outcome }}."
          if (Test-Path export-tests.log) {
            $message += "`n`nLast 70 lines of failing export test:`n```text`n"
            $message += (Get-Content export-tests.log -Tail 70 | Out-String)
            $message += "```"
          }
          & gh issue create --repo "$env:GITHUB_REPOSITORY" --title "HoldFrame Windows build failure" --body "$message"
      - uses: actions/upload-artifact@v4
        with:
          name: HoldFrame-Windows
          path: release/*
