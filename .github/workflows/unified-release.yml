name: HoldFrame - Unified Native Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: holdframe-release
  cancel-in-progress: false

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: android
      - name: Record source revision
        id: source
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$sdk"
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          "$sdk/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$sdk" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Test model, pressure compatibility and Android 12 policy
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/core-tests
          javac --release 17 -d build/core-tests core/src/main/java/dev/rectifydata/holdframe/core/*.java core/src/test/java/dev/rectifydata/holdframe/core/*.java
          for test in CoreTest MediaCoreTest SequenceClipboardTest PressureStrokeTest ReleaseCheckerTest SplitExposureTest SplitAudioTest; do
            java -cp build/core-tests "dev.rectifydata.holdframe.core.$test"
          done
          grep -Eq 'minSdk[[:space:]]*=[[:space:]]*31' app/build.gradle.kts
      - name: Build and verify signed APK
        shell: bash
        run: |
          set -euo pipefail
          version="0.13.${{ github.run_number }}"
          gradle --no-daemon --console=plain :app:assembleDebug \
            -PreleaseVersion="$version" -PbuildNumber="$((13000 + ${{ github.run_number }}))"
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | grep "sdkVersion:'31'"
          mkdir -p release
          cp "$apk" release/HoldFrame-Android12-LowRAM.apk
      - name: Install and launch on Android 12 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          arch: x86_64
          target: google_apis
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: |
            set -e
            adb wait-for-device
            adb install -r release/HoldFrame-Android12-LowRAM.apk
            adb shell am start -W -n dev.rectifydata.holdframe/.MainActivity
            sleep 5
            adb shell pidof dev.rectifydata.holdframe | grep -E '[0-9]'
      - uses: actions/upload-artifact@v4
        with:
          name: holdframe-android
          path: release/HoldFrame-Android12-LowRAM.apk
          if-no-files-found: error

  windows:
    name: Windows interactive EXE installer
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: windows
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile and test Java desktop
        shell: pwsh
        run: |
          ./build.ps1
          if ($LASTEXITCODE -ne 0) { throw "Desktop build failed" }
          New-Item -ItemType Directory -Force build/tests | Out-Null
          $tests = @(Get-ChildItem core/src/test/java/dev/rectifydata/holdframe/core -Filter *.java | ForEach-Object FullName)
          $tests += @(Get-ChildItem desktop/src/test/java/dev/rectifydata/holdframe/windows -Filter *.java | ForEach-Object FullName)
          & javac --release 17 -cp build/classes -d build/tests @tests
          if ($LASTEXITCODE -ne 0) { throw "Desktop test compilation failed" }
          foreach ($test in @("PressureStrokeTest","ReleaseCheckerTest")) {
            & java -cp "build/classes;build/tests" ("dev.rectifydata.holdframe.core." + $test)
            if ($LASTEXITCODE -ne 0) { throw "$test failed" }
          }
          foreach ($test in @("NativeInstallerUpdaterTest","ExportSupportTest","LassoTest")) {
            & java -Djava.awt.headless=true -cp "build/classes;build/tests" ("dev.rectifydata.holdframe.windows." + $test)
            if ($LASTEXITCODE -ne 0) { throw "$test failed" }
          }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate icon
        shell: pwsh
        run: |
          python -m pip install pillow
          python tools/generate_icon.py
      - name: Package native EXE with bundled runtime
        shell: pwsh
        run: |
          $version = "0.13.${{ github.run_number }}"
          New-Item -ItemType Directory -Force release,build/version-meta/META-INF | Out-Null
          Set-Content build/version-meta/META-INF/holdframe-version.txt $version -Encoding ascii
          & jar --update --file dist/HoldFrame.jar -C build/version-meta META-INF/holdframe-version.txt
          if ($LASTEXITCODE -ne 0) { throw "Version stamp failed" }
          & jpackage --type app-image --name HoldFrame --input dist --main-jar HoldFrame.jar --main-class dev.rectifydata.holdframe.windows.HoldFrame --dest packaged --app-version $version --vendor RectifyData --icon assets/HoldFrame.ico
          if ($LASTEXITCODE -ne 0) { throw "jpackage failed" }
          $nsis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (-not (Test-Path $nsis)) { choco install nsis -y --no-progress }
          if (-not (Test-Path $nsis)) { throw "NSIS is missing" }
          Push-Location installers
          & $nsis windows.nsi
          $status = $LASTEXITCODE
          Pop-Location
          if ($status -ne 0) { throw "NSIS packaging failed" }
          if (-not (Test-Path release/HoldFrame-Setup.exe)) { throw "Installer missing" }
          Move-Item release/HoldFrame-Setup.exe release/HoldFrame-Windows-Setup.exe
          if ((Get-Item release/HoldFrame-Windows-Setup.exe).Length -lt 1000000) { throw "Installer too small" }
      - uses: actions/upload-artifact@v4
        with:
          name: holdframe-windows
          path: release/HoldFrame-Windows-Setup.exe
          if-no-files-found: error

  linux:
    name: Linux Debian installer
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: windows
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile and regression test desktop
        shell: bash
        run: |
          set -euo pipefail
          bash build.sh
          javac --release 17 -cp build/classes -d build/classes core/src/test/java/dev/rectifydata/holdframe/core/*.java desktop/src/test/java/dev/rectifydata/holdframe/windows/*.java
          for test in CoreTest PressureStrokeTest MediaCoreTest; do
            java -cp build/classes "dev.rectifydata.holdframe.core.$test"
          done
          for test in NativeInstallerUpdaterTest ExportSupportTest LassoPartialTest; do
            java -Djava.awt.headless=true -cp build/classes "dev.rectifydata.holdframe.windows.$test"
          done
          xvfb-run -a java -cp build/classes dev.rectifydata.holdframe.windows.SelectionAndCursorTest
      - name: Generate original icon
        run: |
          python3 -m pip install pillow
          python3 tools/generate_icon.py
      - name: Build native Debian package with embedded Java
        shell: bash
        run: |
          set -euo pipefail
          version="0.13.${{ github.run_number }}"
          mkdir -p build/version-meta/META-INF release
          printf '%s\n' "$version" > build/version-meta/META-INF/holdframe-version.txt
          jar --update --file dist/HoldFrame.jar -C build/version-meta META-INF/holdframe-version.txt
          jlink --add-modules java.base,java.desktop,java.logging,java.prefs,java.net.http,java.sql \
            --strip-debug --no-header-files --no-man-pages --output build/runtime
          jpackage --type app-image --name HoldFrame --input dist \
            --main-jar HoldFrame.jar --main-class dev.rectifydata.holdframe.windows.HoldFrame \
            --runtime-image build/runtime --icon assets/HoldFrame.png \
            --dest packaged --app-version "$version" --vendor RectifyData
          mkdir -p pkg/DEBIAN pkg/opt/holdframe pkg/usr/share/applications pkg/usr/share/icons/hicolor/256x256/apps
          cp -a packaged/HoldFrame/. pkg/opt/holdframe/
          cat > pkg/DEBIAN/control <<EOF
          Package: holdframe
          Version: $version
          Section: graphics
          Priority: optional
          Architecture: amd64
          Maintainer: RectifyData
          Depends: libc6 (>= 2.34), libasound2 | libasound2t64, libx11-6
          Description: HoldFrame animation editor
           Installed vector-animation editor with bundled runtime.
          EOF
          cat > pkg/usr/share/applications/holdframe.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=HoldFrame
          GenericName=Animation editor
          Exec=/opt/holdframe/bin/HoldFrame
          Icon=holdframe
          Categories=Graphics;2DGraphics;
          Terminal=false
          EOF
          cp assets/HoldFrame.png pkg/usr/share/icons/hicolor/256x256/apps/holdframe.png
          dpkg-deb --root-owner-group -Zgzip -z1 --build pkg release/HoldFrame-Linux-amd64.deb
          dpkg-deb --contents release/HoldFrame-Linux-amd64.deb | grep -F '/opt/holdframe/bin/HoldFrame'
      - uses: actions/upload-artifact@v4
        with:
          name: holdframe-linux
          path: release/HoldFrame-Linux-amd64.deb
          if-no-files-found: error

  publish:
    name: Publish one complete three-platform prerelease
    needs: [android, windows, linux]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: holdframe-*
          merge-multiple: true
          path: release
      - name: Validate all three installers and create checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release
          for name in HoldFrame-Android12-LowRAM.apk HoldFrame-Windows-Setup.exe HoldFrame-Linux-amd64.deb; do
            test -s "$name"
          done
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 3
          unzip -t HoldFrame-Android12-LowRAM.apk >/dev/null
          dpkg-deb --info HoldFrame-Linux-amd64.deb >/dev/null
          test "$(stat -c '%s' HoldFrame-Windows-Setup.exe)" -gt 1000000
          sha256sum HoldFrame-Android12-LowRAM.apk HoldFrame-Windows-Setup.exe HoldFrame-Linux-amd64.deb > SHA256SUMS.txt
      - name: Write release notes with platform downloads
        shell: bash
        run: |
          cat > release-notes.md <<'EOF'
          ## HoldFrame 0.13 — all platforms

          A single prerelease contains every installable platform build, produced together from passing CI jobs.

          | Platform | Download | Install |
          | --- | --- | --- |
          | Android 12+ | **HoldFrame-Android12-LowRAM.apk** | Open the APK; Android asks for installation approval |
          | Windows 10/11 (x64) | **HoldFrame-Windows-Setup.exe** | Run the visible setup wizard; no separate Java install |
          | Linux (Debian/Ubuntu x64) | **HoldFrame-Linux-amd64.deb** | Install with the system package manager; runtime included |

          ### Changes
          - Delete removes the selected pose/audio clip; Esc deselects.
          - Black brush dot and pressure-responsive stroke thickness.
          - KMBS persists brush size across sessions.
          - HFM5 saves pressure samples; old HFM1–HFM4 projects remain readable.
          - In-app download flow hands installation to the operating system rather than silently installing.

          **Preview build:** Android APK is debug-signed, and physical-device testing is not guaranteed. Signature changes can prevent upgrades in place; export/backup projects before replacing the app. Older app versions cannot necessarily reopen HFM5 files.

          The included SHA256SUMS.txt verifies all three installers. Older releases are retained for reference and marked as legacy previews.
          EOF
          echo >> release-notes.md
          echo "Build: $GITHUB_RUN_ID; orchestrator commit: $GITHUB_SHA" >> release-notes.md
      - name: Publish atomically as one GitHub prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.HOLDFRAME_RELEASE_TOKEN || github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="v0.13.${{ github.run_number }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::Tag already exists; refusing to overwrite published downloads"
            exit 1
          fi
          gh release create "$tag" \
            release/HoldFrame-Android12-LowRAM.apk \
            release/HoldFrame-Windows-Setup.exe \
            release/HoldFrame-Linux-amd64.deb \
            release/SHA256SUMS.txt \
            --target "$GITHUB_SHA" --title "HoldFrame $tag — Android, Windows & Linux" \
            --notes-file release-notes.md --prerelease
          gh release view "$tag" --json assets --jq '.assets[].name' | sort > actual-assets.txt
          printf '%s\n' HoldFrame-Android12-LowRAM.apk HoldFrame-Windows-Setup.exe HoldFrame-Linux-amd64.deb SHA256SUMS.txt | sort > expected-assets.txt
          diff -u expected-assets.txt actual-assets.txt
