name: HoldFrame unified Windows Linux Android release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: holdframe-unified-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Set up preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$SDK_ROOT"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Validate Android 12 minimum and scroll policy
        run: |
          set -euo pipefail
          grep -Eq 'minSdk[[:space:]]*=[[:space:]]*31' app/build.gradle.kts
          mkdir -p build/policy-tests
          javac --release 17 -d build/policy-tests app/src/main/java/dev/rectifydata/holdframe/RamProfile.java app/src/main/java/dev/rectifydata/holdframe/TimelineScrollPolicy.java app/src/test/java/dev/rectifydata/holdframe/RamProfileTest.java app/src/test/java/dev/rectifydata/holdframe/TimelineScrollPolicyTest.java
          java -cp build/policy-tests dev.rectifydata.holdframe.RamProfileTest
          java -cp build/policy-tests dev.rectifydata.holdframe.TimelineScrollPolicyTest
      - name: Build and sign Android APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --console=plain :app:assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/HoldFrame-Android12-LowRAM.apk
      - uses: actions/upload-artifact@v4
        with:
          name: holdframe-build-android
          path: release/HoldFrame-Android12-LowRAM.apk
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: windows
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile Windows and cross-platform Java app
        shell: pwsh
        run: |
          ./build.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Windows compilation failed' }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate Windows application icon
        shell: pwsh
        run: |
          python -m pip install pillow
          if ($LASTEXITCODE -ne 0) { throw 'Pillow installation failed' }
          python tools/generate_icon.py
          if ($LASTEXITCODE -ne 0) { throw 'Icon generation failed' }
          if (-not (Test-Path assets/HoldFrame.ico)) { throw 'ICO generation failed' }
      - name: Create bundled-runtime Windows application
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          & jpackage --type app-image --name HoldFrame --input dist --main-jar HoldFrame.jar --main-class dev.rectifydata.holdframe.windows.HoldFrame --dest packaged --app-version "0.8.${{ github.run_number }}" --vendor RectifyData --icon assets/HoldFrame.ico
          if ($LASTEXITCODE -ne 0) { throw 'jpackage failed' }
      - name: Build visible Windows installer
        shell: pwsh
        run: |
          $nsis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (-not (Test-Path $nsis)) {
            choco install nsis -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'NSIS installation failed' }
          }
          if (-not (Test-Path $nsis)) { throw 'NSIS executable not found' }
          Push-Location installers
          & $nsis windows.nsi
          $status = $LASTEXITCODE
          Pop-Location
          if ($status -ne 0) { throw "NSIS build failed: $status" }
          Copy-Item release/HoldFrame-Setup.exe release/HoldFrame-Windows-Setup.exe
      - name: Package portable Windows app and cross-platform JAR
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force staging | Out-Null
          Copy-Item dist/HoldFrame.jar staging/HoldFrame.jar
          Copy-Item launch.bat staging/launch.bat
          Copy-Item launch.sh staging/launch.sh
          Copy-Item README.md staging/README.md
          Compress-Archive -Path staging/* -DestinationPath release/HoldFrame-Windows-Portable.zip -Force
          Copy-Item dist/HoldFrame.jar release/HoldFrame-cross-platform.jar
          foreach ($file in @("HoldFrame-Windows-Setup.exe","HoldFrame-Windows-Portable.zip","HoldFrame-cross-platform.jar")) {
            if (-not (Test-Path "release/$file")) { throw "Missing $file" }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: holdframe-build-windows
          path: |
            release/HoldFrame-Windows-Setup.exe
            release/HoldFrame-Windows-Portable.zip
            release/HoldFrame-cross-platform.jar
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: windows
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile Linux desktop
        run: bash build.sh
      - name: Verify core, exports, tabs and timeline
        shell: bash
        run: |
          set -euo pipefail
          javac --release 17 -cp build/classes -d build/classes core/src/test/java/dev/rectifydata/holdframe/core/*.java desktop/src/test/java/dev/rectifydata/holdframe/windows/*.java
          java -cp build/classes dev.rectifydata.holdframe.core.CoreTest
          java -cp build/classes dev.rectifydata.holdframe.core.MediaCoreTest
          java -cp build/classes dev.rectifydata.holdframe.core.SequenceClipboardTest
          java -Djava.awt.headless=true -cp build/classes dev.rectifydata.holdframe.windows.ExportSupportTest
          if ! command -v xvfb-run >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y xvfb
          fi
          xvfb-run -a java -cp build/classes dev.rectifydata.holdframe.windows.TimelineAutoScrollTest
          xvfb-run -a java -cp build/classes dev.rectifydata.holdframe.windows.TimelineDragAndLayoutTest
          xvfb-run -a java -cp build/classes dev.rectifydata.holdframe.windows.FeatureTabsAndKeymapTest
      - name: Build Linux DEB installer with bundled Java
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y fakeroot dpkg-dev
          python3 -m pip install pillow
          python3 tools/generate_icon.py
          test -s assets/HoldFrame.png
          mkdir -p release packaged
          jpackage --type deb --name HoldFrame --input dist --main-jar HoldFrame.jar \
            --main-class dev.rectifydata.holdframe.windows.HoldFrame \
            --icon assets/HoldFrame.png --dest packaged \
            --app-version "0.8.${{ github.run_number }}" --vendor RectifyData \
            --linux-package-name holdframe --linux-shortcut
          deb="$(find packaged -maxdepth 1 -type f -name '*.deb' -print -quit)"
          test -n "$deb" && test -s "$deb"
          cp "$deb" release/HoldFrame-Linux-amd64.deb
          dpkg-deb --info release/HoldFrame-Linux-amd64.deb
      - uses: actions/upload-artifact@v4
        with:
          name: holdframe-build-linux
          path: release/HoldFrame-Linux-amd64.deb
          if-no-files-found: error

  unified-release:
    needs: [android, windows, linux]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          pattern: holdframe-build-*
          path: collected
          merge-multiple: false
      - name: Inspect platform files
        id: inspect
        shell: bash
        run: |
          set -euo pipefail
          find collected -type f -printf '%p: %s bytes\n' | sort | tee artifact-layout.txt
          test "$(find collected -type f | wc -l)" -ge 5
      - name: Prepare exactly three standalone platform installers
        id: assemble
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from shutil import copyfile
          targets={
              'holdframe-build-android/HoldFrame-Android12-LowRAM.apk':'HoldFrame-Android12-LowRAM.apk',
              'holdframe-build-windows/HoldFrame-Windows-Setup.exe':'HoldFrame-Windows-Setup.exe',
              'holdframe-build-linux/HoldFrame-Linux-amd64.deb':'HoldFrame-Linux-amd64.deb',
          }
          output=Path('release')
          output.mkdir(exist_ok=True)
          for source,name in targets.items():
              direct=Path('collected')/source
              if not direct.is_file():
                  candidates=list((Path('collected')/source.split('/')[0]).rglob(name))
                  if len(candidates)!=1:
                      raise RuntimeError(f'Missing or ambiguous platform binary {source}: {candidates}')
                  direct=candidates[0]
              if direct.stat().st_size<1000:
                  raise RuntimeError(f'Empty/invalid binary: {direct}')
              copyfile(direct,output/name)
              print(f'{name}: {(output/name).stat().st_size} bytes')
          signatures={
              'HoldFrame-Android12-LowRAM.apk':b'PK',
              'HoldFrame-Windows-Setup.exe':b'MZ',
              'HoldFrame-Linux-amd64.deb':b'!<arch>\n',
          }
          for filename,header in signatures.items():
              with (output/filename).open('rb') as f:
                  if not f.read(len(header)).startswith(header):
                      raise RuntimeError(f'{filename} failed file-signature verification')
          actual={f.name for f in output.iterdir() if f.is_file()}
          if actual!=set(targets.values()):
              raise RuntimeError(f'Exactly three standalone assets are required; got {actual}')
          PY
      - name: Publish release with three individual attachments
        id: publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="v0.8.${{ github.run_number }}"
          # One-time migration: replace the incorrect all-in-one ZIP on v0.8.6.
          if gh release view "v0.8.6" >/dev/null 2>&1 && \
              gh release view "v0.8.6" --json assets --jq '.assets[].name' | grep -q -- '-All-Platforms.zip'; then
            tag="v0.8.6"
          fi
          notes="One release with three direct downloads: Android 12+ APK (debug-signed), Windows interactive installer EXE, and Debian/Ubuntu x86-64 DEB installer with bundled Java. Android follow-scroll updated; physical touch testing still pending."
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$GITHUB_SHA" \
              --title "HoldFrame $tag (Android / Windows / Linux)" \
              --notes "$notes" --prerelease 2>&1 | tee publish.log
          fi
          assets=(
            release/HoldFrame-Android12-LowRAM.apk
            release/HoldFrame-Windows-Setup.exe
            release/HoldFrame-Linux-amd64.deb
          )
          for asset in "${assets[@]}"; do
            test -s "$asset"
            uploaded=0
            for attempt in 1 2 3; do
              if gh release upload "$tag" "$asset" --clobber 2>&1 | tee -a publish.log; then
                uploaded=1
                break
              fi
              sleep 5
            done
            if [ "$uploaded" -ne 1 ]; then
              echo "::error::Failed uploading $asset to $tag" | tee -a publish.log
              exit 1
            fi
          done
          # Remove the previous all-in-one ZIP (and any other obsolete extras).
          while IFS= read -r old; do
            case "$old" in
              HoldFrame-Android12-LowRAM.apk|HoldFrame-Windows-Setup.exe|HoldFrame-Linux-amd64.deb) ;;
              *) gh release delete-asset "$tag" "$old" --yes 2>&1 | tee -a publish.log ;;
            esac
          done < <(gh release view "$tag" --json assets --jq '.assets[].name')
          gh release edit "$tag" --title "HoldFrame $tag (Android / Windows / Linux)" \
            --notes "$notes" --prerelease 2>&1 | tee -a publish.log
          gh release view "$tag" --json assets --jq '.assets[].name' | sort > actual-assets.txt
          printf '%s\n' \
            HoldFrame-Android12-LowRAM.apk \
            HoldFrame-Linux-amd64.deb \
            HoldFrame-Windows-Setup.exe > expected-assets.txt
          diff -u expected-assets.txt actual-assets.txt
          echo "Confirmed: $tag contains exactly the 3 direct platform assets."
      - name: Diagnose unified archive or publication failure
        if: failure()
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          INSPECT: ${{ steps.inspect.outcome }}
          ASSEMBLE: ${{ steps.assemble.outcome }}
          PUBLISH: ${{ steps.publish.outcome }}
        run: |
          {
            echo "Unified artifact build failed: inspect=$INSPECT, assemble=$ASSEMBLE, publish=$PUBLISH"
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo 'Downloaded artifact files:'
            if test -f artifact-layout.txt; then cat artifact-layout.txt; else find collected -maxdepth 4 -type f -print 2>/dev/null || true; fi
            echo
            echo 'Generated release assets:'
            ls -lh release/* 2>/dev/null || true
            echo
            echo 'GitHub release API response:'
            if test -f publish.log; then tail -n 100 publish.log; else echo 'No publish.log (failure before release creation).'; fi
          } > unified-error.md
          gh issue create --repo "$GITHUB_REPOSITORY" --title "HoldFrame combined release packaging failure ($GITHUB_RUN_NUMBER)" --body-file unified-error.md

  report-build-failure:
    needs: [android, windows, linux, unified-release]
    if: ${{ always() && (needs.android.result == 'failure' || needs.windows.result == 'failure' || needs.linux.result == 'failure' || needs.unified-release.result == 'failure') }}
    runs-on: ubuntu-latest
    steps:
      - name: Report exact failed platform to GitHub issues
        env:
          GH_TOKEN: ${{ github.token }}
          ANDROID_STATUS: ${{ needs.android.result }}
          WINDOWS_STATUS: ${{ needs.windows.result }}
          LINUX_STATUS: ${{ needs.linux.result }}
          RELEASE_STATUS: ${{ needs.unified-release.result }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "HoldFrame unified build failed ($GITHUB_RUN_NUMBER)" \
            --body "Windows=$WINDOWS_STATUS; Linux=$LINUX_STATUS; Android=$ANDROID_STATUS; UnifiedRelease=$RELEASE_STATUS. Logs: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
