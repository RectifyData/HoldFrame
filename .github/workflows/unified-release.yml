name: HoldFrame Android APK and cross-platform executable Java JAR
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: holdframe-unified-${{ github.ref }}
  cancel-in-progress: false
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Set up preinstalled Android SDK
        id: sdk
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$SDK_ROOT"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Validate Android 12 minimum and scroll policy
        id: validate
        run: |
          set -euo pipefail
          grep -Eq 'minSdk[[:space:]]*=[[:space:]]*31' app/build.gradle.kts
          mkdir -p build/policy-tests
          javac --release 17 -d build/policy-tests app/src/main/java/dev/rectifydata/holdframe/RamProfile.java app/src/main/java/dev/rectifydata/holdframe/TimelineScrollPolicy.java app/src/test/java/dev/rectifydata/holdframe/RamProfileTest.java app/src/test/java/dev/rectifydata/holdframe/TimelineScrollPolicyTest.java
          java -cp build/policy-tests dev.rectifydata.holdframe.RamProfileTest
          java -cp build/policy-tests dev.rectifydata.holdframe.TimelineScrollPolicyTest
          mkdir -p build/release-tests
          javac --release 17 -d build/release-tests core/src/main/java/dev/rectifydata/holdframe/core/*.java core/src/test/java/dev/rectifydata/holdframe/core/*.java
          java -cp build/release-tests dev.rectifydata.holdframe.core.ReleaseCheckerTest
          java -cp build/release-tests dev.rectifydata.holdframe.core.TextTransformMathTest
          java -cp build/release-tests dev.rectifydata.holdframe.core.TextTransformProjectTest
          java -cp build/release-tests dev.rectifydata.holdframe.core.SplitExposureTest
          java -cp build/release-tests dev.rectifydata.holdframe.core.SplitAudioTest
      - name: Build and sign Android APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --console=plain :app:assembleDebug \
            -PreleaseVersion="0.11.$GITHUB_RUN_NUMBER" \
            -PbuildNumber="$((9000 + GITHUB_RUN_NUMBER))" 2>&1 | tee android-build.log
          test -s app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | tee apk-badging.txt
          grep -q "package: name='dev.rectifydata.holdframe'" apk-badging.txt
          grep -q "sdkVersion:'31'" apk-badging.txt
          unzip -t app/build/outputs/apk/debug/app-debug.apk | tail -n 2
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/HoldFrame-Android12-LowRAM.apk
      - name: Compare previous-release signing identity
        id: cert
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p previous
          if gh release download v0.8.6 --pattern 'HoldFrame-Android12-LowRAM.apk' --dir previous; then
            previous_cert=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs previous/HoldFrame-Android12-LowRAM.apk | grep 'Signer #1 certificate SHA-256 digest' || true)
            current_cert=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | grep 'Signer #1 certificate SHA-256 digest' || true)
            echo "Previously released APK: $previous_cert"
            echo "New APK: $current_cert"
            if test -n "$previous_cert" && test "$previous_cert" != "$current_cert"; then
              echo "::warning::DEBUG SIGNING KEY ROTATED. This APK cannot upgrade the previously installed HoldFrame APK in place."
            fi
          fi
      - name: Enable KVM acceleration for Android emulator
        id: kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Fresh install and launch on Android 12 emulator
        id: emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          arch: x86_64
          target: google_apis
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: |
            set -e
            echo "Testing the exact APK released by the Android job"
            adb wait-for-device
            adb shell getprop ro.build.version.sdk | tee emulator-sdk.txt
            echo "INSTALL" | tee -a emulator-checkpoints.txt
            adb install -r app/build/outputs/apk/debug/app-debug.apk 2>&1 | tee emulator-install.txt
            echo "PACKAGE" | tee -a emulator-checkpoints.txt
            adb shell pm path dev.rectifydata.holdframe 2>&1 | tee emulator-package.txt
            echo "START" | tee -a emulator-checkpoints.txt
            adb logcat -c || true
            adb shell am start -W -n dev.rectifydata.holdframe/.MainActivity 2>&1 | tee emulator-start.txt
            sleep 5
            echo "RUNNING" | tee -a emulator-checkpoints.txt
            adb shell pidof dev.rectifydata.holdframe 2>&1 | tee emulator-pid.txt
            test -s emulator-pid.txt
            echo "FOREGROUND" | tee -a emulator-checkpoints.txt
            adb shell dumpsys activity activities > emulator-activities.txt
            grep -E 'dev.rectifydata.holdframe|MainActivity' emulator-activities.txt | head -n 12
            echo "SUCCESS" | tee -a emulator-checkpoints.txt
      - name: Capture Android emulator failure evidence
        if: failure()
        continue-on-error: true
        shell: bash
        run: |
          {
            echo '=== Emulator checkpoints ==='
            cat emulator-checkpoints.txt 2>/dev/null || true
            echo '=== ADB devices ==='
            adb devices -l 2>&1 || true
            for log in emulator-sdk.txt emulator-install.txt emulator-package.txt emulator-start.txt emulator-pid.txt; do
              echo "=== $log ==="
              tail -n 30 "$log" 2>/dev/null || true
            done
            echo '=== Android runtime crash stack ==='
            adb logcat -d -t 400 -v time 2>/dev/null | grep -E -A 24 'FATAL EXCEPTION|AndroidRuntime|dev.rectifydata.holdframe|INSTALL_FAILED|ActivityNotFoundException' | tail -n 120 || true
            echo '=== Emulator processes ==='
            ps aux | grep -E 'qemu-system|emulator' | grep -v grep | head -n 10 || true
          } > emulator-diagnostics.txt 2>&1
      - name: Report exact Android CI failure with build diagnostics
        if: failure()
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SDK_STEP: ${{ steps.sdk.outcome }}
          VALIDATE_STEP: ${{ steps.validate.outcome }}
          APK_STEP: ${{ steps.apk.outcome }}
          CERT_STEP: ${{ steps.cert.outcome }}
          KVM_STEP: ${{ steps.kvm.outcome }}
          EMULATOR_STEP: ${{ steps.emulator.outcome }}
        run: |
          {
            echo "HoldFrame Android build failure (run $GITHUB_RUN_NUMBER)"
            echo "Steps: SDK=$SDK_STEP; validate=$VALIDATE_STEP; APK=$APK_STEP; cert=$CERT_STEP; KVM=$KVM_STEP; emulator=$EMULATOR_STEP"
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo 'Gradle compiler diagnostic:'
            echo '~~' '~~' 'text'
            if test -f android-build.log; then
              grep -Ei -A 5 'error:|^FAILURE:|^\* What went wrong|^> Task .*FAILED|cannot find symbol|unresolved reference|execution failed|does not exist' android-build.log | tail -n 100 | head -c 16000 || true
            else
              echo 'No Gradle compile log; failure occurred before the APK step.'
            fi
            echo '~~' '~~'
            echo 'APK size:'
            ls -lh app/build/outputs/apk/debug/*.apk 2>/dev/null || true
            echo 'Android emulator install and launch report:'
            if test -f emulator-diagnostics.txt; then
              tail -n 200 emulator-diagnostics.txt | head -c 18000
            else
              echo 'No emulator diagnostics file. Emulation failed during setup or logs were unavailable.'
            fi
          } > android-failure.md
          gh issue create -R "$GH_REPO" --title "HoldFrame Android error details ($GITHUB_RUN_NUMBER)" --body-file android-failure.md
      - name: Upload Android failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: HoldFrame-Android-failure-${{ github.run_number }}
          path: |
            android-build.log
            android-failure.md
            emulator-*.txt
            app/build/reports/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: holdframe-build-android
          path: release/HoldFrame-Android12-LowRAM.apk
          if-no-files-found: error


  java:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: windows
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build executable cross-platform JAR
        run: |
          set -euo pipefail
          bash build.sh
          test -s dist/HoldFrame.jar
          unzip -p dist/HoldFrame.jar META-INF/MANIFEST.MF | tr -d '\r' | grep -q '^Main-Class: dev.rectifydata.holdframe.windows.HoldFrame'
      - name: Java and timeline tests
        run: |
          set -euo pipefail
          javac --release 17 -cp build/classes -d build/classes core/src/test/java/dev/rectifydata/holdframe/core/*.java desktop/src/test/java/dev/rectifydata/holdframe/windows/*.java
          java -cp build/classes dev.rectifydata.holdframe.core.CoreTest
          java -cp build/classes dev.rectifydata.holdframe.core.MediaCoreTest
          java -cp build/classes dev.rectifydata.holdframe.core.SequenceClipboardTest
          java -cp build/classes dev.rectifydata.holdframe.core.ReleaseCheckerTest
          java -cp build/classes dev.rectifydata.holdframe.core.TextTransformMathTest
          java -cp build/classes dev.rectifydata.holdframe.core.TextTransformProjectTest
          java -cp build/classes dev.rectifydata.holdframe.core.SplitExposureTest
          java -cp build/classes dev.rectifydata.holdframe.core.SplitAudioTest
          java -cp build/classes dev.rectifydata.holdframe.windows.LassoPartialTest
          java -cp build/classes dev.rectifydata.holdframe.windows.ShortcutSupportTest
          java -Djava.awt.headless=true -cp build/classes dev.rectifydata.holdframe.windows.CanvasZoomTest
          java -Djava.awt.headless=true -cp build/classes dev.rectifydata.holdframe.windows.ExportSupportTest
          if ! command -v xvfb-run >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y xvfb; fi
          xvfb-run -a java -cp build/classes dev.rectifydata.holdframe.windows.TimelineAutoScrollTest
          xvfb-run -a java -cp build/classes dev.rectifydata.holdframe.windows.TimelineDragAndLayoutTest
          xvfb-run -a java -cp build/classes dev.rectifydata.holdframe.windows.FeatureTabsAndKeymapTest
          xvfb-run -a java -cp build/classes dev.rectifydata.holdframe.windows.DirectTextTransformTest
          xvfb-run -a java -cp build/classes dev.rectifydata.holdframe.windows.LassoPartialGuiTest
          xvfb-run -a java -cp build/classes dev.rectifydata.holdframe.windows.TextAndFourHandleTest
      - name: Stage Java executable
        run: |
          mkdir -p release
          cp dist/HoldFrame.jar release/HoldFrame-Desktop.jar
          mkdir -p build/version-meta/META-INF
          printf '0.11.%s\n' "$GITHUB_RUN_NUMBER" > build/version-meta/META-INF/holdframe-version.txt
          jar --update --file release/HoldFrame-Desktop.jar -C build/version-meta META-INF/holdframe-version.txt
          unzip -p release/HoldFrame-Desktop.jar META-INF/holdframe-version.txt | grep -q "^0.11.$GITHUB_RUN_NUMBER$"
      - uses: actions/upload-artifact@v4
        with:
          name: holdframe-build-java
          path: release/HoldFrame-Desktop.jar
          if-no-files-found: error

  unified-release:
    needs: [android, java]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          pattern: holdframe-build-*
          path: collected
      - name: Prepare and verify two direct release assets
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from shutil import copyfile
          from zipfile import ZipFile, is_zipfile
          sources={
            'holdframe-build-android/HoldFrame-Android12-LowRAM.apk':'HoldFrame-Android12-LowRAM.apk',
            'holdframe-build-java/HoldFrame-Desktop.jar':'HoldFrame-Desktop.jar',
          }
          release=Path('release')
          release.mkdir(exist_ok=True)
          for source,name in sources.items():
            inp=Path('collected')/source
            if not inp.is_file():
              matches=list((Path('collected')/source.split('/')[0]).rglob(name))
              if len(matches)!=1:
                raise RuntimeError(f'Missing/ambiguous asset {source}: {matches}')
              inp=matches[0]
            if inp.stat().st_size<1000 or not is_zipfile(inp):
              raise RuntimeError(f'Invalid APK or JAR: {inp}')
            copyfile(inp,release/name)
            print(name,(release/name).stat().st_size)
          with ZipFile(release/'HoldFrame-Desktop.jar') as jar:
            manifest=jar.read('META-INF/MANIFEST.MF').decode('utf-8')
            if 'Main-Class: dev.rectifydata.holdframe.windows.HoldFrame' not in manifest or jar.testzip():
              raise RuntimeError('Java executable invalid')
          with ZipFile(release/'HoldFrame-Android12-LowRAM.apk') as apk:
            if 'AndroidManifest.xml' not in apk.namelist() or apk.testzip():
              raise RuntimeError('Android APK invalid')
          if {p.name for p in release.iterdir()}!=set(sources.values()):
            raise RuntimeError('Release must contain exactly two build outputs')
          PY
      - name: Publish both files under one GitHub tag (no combined ZIP)
        id: publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="v0.11.${{ github.run_number }}"
          notes="HoldFrame: Split animation and selected audio at playhead, vector-accurate lasso selection, undoable Edit/Delete of selected objects, Android text deletion, four-corner text transforms, Windows/Linux shortcut creation and existing canvas zoom/updater. Exactly two attachments: Android 12+ experimental APK and executable Java 17+ JAR for Windows/Linux. Debug APK may require backing up app data before reinstalling; device testing is still recommended."
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$GITHUB_SHA" \
              --title "HoldFrame $tag (Android APK + Java JAR)" \
              --notes "$notes" --prerelease 2>&1 | tee publish.log
          fi
          for asset in release/HoldFrame-Android12-LowRAM.apk release/HoldFrame-Desktop.jar; do
            success=0
            for attempt in 1 2 3; do
              if gh release upload "$tag" "$asset" --clobber 2>&1 | tee -a publish.log; then
                success=1; break
              fi
              sleep 5
            done
            if [ "$success" -ne 1 ]; then
              echo "::error::Failed to upload $asset" | tee -a publish.log
              exit 1
            fi
          done
          while IFS= read -r extra; do
            case "$extra" in
              HoldFrame-Android12-LowRAM.apk|HoldFrame-Desktop.jar) ;;
              *) gh release delete-asset "$tag" "$extra" --yes 2>&1 | tee -a publish.log ;;
            esac
          done < <(gh release view "$tag" --json assets --jq '.assets[].name')
          gh release edit "$tag" --title "HoldFrame $tag (Android APK + Java JAR)" \
            --notes "$notes" --prerelease
          gh release view "$tag" --json assets --jq '.assets[].name' | sort > actual.txt
          printf '%s\n' HoldFrame-Android12-LowRAM.apk HoldFrame-Desktop.jar > expected.txt
          diff -u expected.txt actual.txt
          echo "Verified exactly two assets in $tag."
      - name: Report failed release publication
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          {
            echo 'HoldFrame direct APK/JAR publication failed.'
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            find collected -type f -printf '%p %s bytes\n' 2>/dev/null || true
            if test -f publish.log; then tail -n 70 publish.log; fi
          } > failure.md
          gh issue create -R "$GH_REPO" --title "HoldFrame two-file release publication failure ($GITHUB_RUN_NUMBER)" --body-file failure.md

  report-build-failure:
    needs: [android, java, unified-release]
    if: ${{ always() && (needs.android.result == 'failure' || needs.java.result == 'failure' || needs.unified-release.result == 'failure') }}
    runs-on: ubuntu-latest
    steps:
      - name: Report failed platform
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          A_STATUS: ${{ needs.android.result }}
          J_STATUS: ${{ needs.java.result }}
          R_STATUS: ${{ needs.unified-release.result }}
        run: |
          gh issue create -R "$GH_REPO" --title "HoldFrame two-file build failure ($GITHUB_RUN_NUMBER)" \
            --body "Android=$A_STATUS; Java=$J_STATUS; Release=$R_STATUS. Logs: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
