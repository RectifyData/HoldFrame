name: HoldFrame Android API 31 build and prerelease
on:
  push:
    branches: [android]
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: false
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install and verify Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"
          java -version
          gradle --version
      - name: Test shared core
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          javac -d out core/src/main/java/dev/rectifydata/holdframe/core/*.java core/src/test/java/dev/rectifydata/holdframe/core/*.java
          java -cp out dev.rectifydata.holdframe.core.CoreTest
          java -cp out dev.rectifydata.holdframe.core.MediaCoreTest
          java -cp out dev.rectifydata.holdframe.core.SequenceClipboardTest
      - name: Memory policy tests and Android 12 minimum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/ram
          javac -d out/ram app/src/main/java/dev/rectifydata/holdframe/RamProfile.java app/src/test/java/dev/rectifydata/holdframe/RamProfileTest.java
          java -cp out/ram dev.rectifydata.holdframe.RamProfileTest
          grep -Eq 'minSdk[[:space:]]*=[[:space:]]*31' app/build.gradle.kts
      - name: Compile Android APK (keep full diagnostics)
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --console=plain --stacktrace --warning-mode=all :app:assembleDebug 2>&1 | tee android-build.log
          test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Verify debug APK signing
        if: steps.apk.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
      - name: Record actual failure diagnostics
        if: failure()
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          {
            echo 'Android 12/Low-RAM compile failed. This is not a passing APK build.'
            echo
            echo "Build: $RUN_URL (attempt $RUN_ATTEMPT)"
            echo "Commit: $GITHUB_SHA"
            echo
            echo 'Relevant Gradle error lines:'
            echo '```text'
            if test -f android-build.log; then
              grep -E -i '(^FAILURE:|^\* What went wrong:|^> Task |error:|could not |failed|not found|exception|unresolved reference)' android-build.log | tail -n 70 | head -c 12000 || true
            else
              echo 'No Gradle output found: failure occurred before the APK compile step. See the run URL.'
            fi
            echo '```'
          } > android-failure-summary.md
          issue_number=$(gh issue list -R "$REPOSITORY" --state open --search '"HoldFrame Android build failure" in:title' --json number --jq '.[0].number // empty' 2>/dev/null || true)
          if test -n "$issue_number"; then
            gh issue comment "$issue_number" -R "$REPOSITORY" --body-file android-failure-summary.md
          else
            gh issue create -R "$REPOSITORY" --title 'HoldFrame Android build failure (diagnostics)' --body-file android-failure-summary.md
          fi
      - name: Upload build logs if anything failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: HoldFrame-Android-build-diagnostics-${{ github.run_number }}
          path: |
            android-build.log
            app/build/reports/
            app/build/outputs/logs/
          if-no-files-found: warn
      - name: Upload tested APK
        uses: actions/upload-artifact@v4
        with:
          name: HoldFrame-Android12-LowRAM-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish GitHub prerelease
        if: github.ref == 'refs/heads/android'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="android-v0.6.${{ github.run_number }}-r${{ github.run_attempt }}"
          gh release create "$tag" \
            app/build/outputs/apk/debug/app-debug.apk \
            --target "$GITHUB_SHA" \
            --title "HoldFrame Android 12 Low RAM preview ${{ github.run_number }}" \
            --notes "Android 12+ (minimum API 31). Automatic Low RAM mode for devices with 6 GiB RAM or less; settings include Auto/On/Off. Debug-signed testing APK, not yet validated on a physical phone." \
            --prerelease
