name: HoldFrame Linux preview
on:
  push:
    branches: [windows]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build Java desktop app
        run: ./build.sh
      - name: Test core
        run: |
          javac --release 17 -cp build/classes -d build/classes core/src/test/java/dev/rectifydata/holdframe/core/*.java
          java -cp build/classes dev.rectifydata.holdframe.core.CoreTest
          java -cp build/classes dev.rectifydata.holdframe.core.MediaCoreTest
          java -cp build/classes dev.rectifydata.holdframe.core.SequenceClipboardTest
      - name: Test lasso math and live Swing interface
        run: |
          javac --release 17 -cp build/classes -d build/classes desktop/src/test/java/dev/rectifydata/holdframe/windows/*.java
          java -cp build/classes dev.rectifydata.holdframe.windows.LassoTest
          java -Djava.awt.headless=true -cp build/classes dev.rectifydata.holdframe.windows.ExportSupportTest
          java -Djava.awt.headless=true -cp build/classes dev.rectifydata.holdframe.windows.FontSupportTest
          xvfb-run -a java -cp build/classes dev.rectifydata.holdframe.windows.DesktopFeatureTest
          xvfb-run -a java -cp build/classes dev.rectifydata.holdframe.windows.TextAndFourHandleTest
          xvfb-run -a java -cp build/classes dev.rectifydata.holdframe.windows.TimelineAutoScrollTest
          xvfb-run -a java -cp build/classes dev.rectifydata.holdframe.windows.TimelineDragAndLayoutTest
          xvfb-run -a java -cp build/classes dev.rectifydata.holdframe.windows.SequenceClipboardGuiTest
          xvfb-run -a java -cp build/classes dev.rectifydata.holdframe.windows.MediaFeatureTest
          xvfb-run -a java -cp build/classes dev.rectifydata.holdframe.windows.ExportMenuGuiTest
          timeout 30s xvfb-run -a java -cp build/classes dev.rectifydata.holdframe.windows.NativeDialogSmokeTest
      - name: Generate app icon
        run: |
          python3 -m pip install pillow
          python3 tools/generate_icon.py
      - name: Package portable Linux app with included runtime
        run: |
          mkdir -p release
          jpackage --type app-image --name HoldFrame --input dist --main-jar HoldFrame.jar \
            --main-class dev.rectifydata.holdframe.windows.HoldFrame --icon assets/HoldFrame.png --dest packaged \
            --app-version "0.5.${{ github.run_number }}" --vendor RectifyData
          tar -C packaged -czf release/HoldFrame-Linux-portable.tar.gz HoldFrame
          cp dist/HoldFrame.jar release/HoldFrame-cross-platform.jar
      - uses: actions/upload-artifact@v4
        with:
          name: HoldFrame-Linux
          path: release/*
      - name: Publish Linux prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "linux-v0.5.${{ github.run_number }}" release/* \
            --target "$GITHUB_SHA" \
            --title "HoldFrame Linux export preview ${{ github.run_number }}" \
            --notes "Linux app with bundled Java and cross-platform JAR. Added MP4+audio, animated GIF, PNG sequence ZIP, sprite sheet, still export, background progress, cancellation and CLI. Preview build." \
            --prerelease
