name: HoldFrame native Linux DEB CI
on:
  push:
    branches: [windows]
  workflow_dispatch:
permissions:
  contents: write
  issues: write
jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build Java source (implementation only)
        run: bash build.sh
      - name: Compile and run shared model and desktop tests
        run: |
          set -euo pipefail
          javac --release 17 -cp build/classes -d build/classes core/src/test/java/dev/rectifydata/holdframe/core/*.java desktop/src/test/java/dev/rectifydata/holdframe/windows/*.java
          for test in CoreTest MediaCoreTest SequenceClipboardTest ReleaseCheckerTest TextTransformMathTest TextTransformProjectTest SplitExposureTest SplitAudioTest PressureStrokeTest; do
            java -cp build/classes dev.rectifydata.holdframe.core."$test"
          done
          for test in LassoTest LassoPartialTest CanvasZoomTest ExportSupportTest FontSupportTest ShortcutSupportTest; do
            java -Djava.awt.headless=true -cp build/classes dev.rectifydata.holdframe.windows."$test"
          done
          for test in DesktopFeatureTest TextAndFourHandleTest TimelineAutoScrollTest TimelineDragAndLayoutTest FeatureTabsAndKeymapTest SequenceClipboardGuiTest MediaFeatureTest ExportMenuGuiTest SelectionAndCursorTest; do
            timeout 40s xvfb-run -a java -cp build/classes dev.rectifydata.holdframe.windows."$test"
          done
      - name: Generate bundled application icon
        run: |
          python3 -m pip install pillow
          python3 tools/generate_icon.py
      - name: Build actual Debian installer with bundled Java runtime
        run: |
          set -euo pipefail
          version="0.12.$GITHUB_RUN_NUMBER"
          mkdir -p release build/version-meta/META-INF
          printf '%s\n' "$version" > build/version-meta/META-INF/holdframe-version.txt
          jar --update --file dist/HoldFrame.jar -C build/version-meta META-INF/holdframe-version.txt
          jlink --add-modules java.base,java.desktop,java.logging,java.prefs,java.net.http,java.sql \
            --strip-debug --no-header-files --no-man-pages --output build/runtime
          jpackage --type app-image --name HoldFrame --input dist \
            --main-jar HoldFrame.jar --main-class dev.rectifydata.holdframe.windows.HoldFrame \
            --runtime-image build/runtime --icon assets/HoldFrame.png \
            --dest packaged --app-version "$version" --vendor RectifyData
          mkdir -p pkg/DEBIAN pkg/opt/holdframe pkg/usr/share/applications pkg/usr/share/icons/hicolor/256x256/apps
          cp -a packaged/HoldFrame/. pkg/opt/holdframe/
          cat > pkg/DEBIAN/control <<EOF
          Package: holdframe
          Version: $version
          Section: graphics
          Priority: optional
          Architecture: amd64
          Maintainer: RectifyData
          Depends: libc6 (>= 2.34), libasound2 | libasound2t64, libx11-6
          Description: HoldFrame animation editor
           Native launcher with bundled runtime for vector and exposure animation editing.
          EOF
          cat > pkg/usr/share/applications/holdframe.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=HoldFrame
          GenericName=Animation editor
          Comment=Create and edit vector animations
          Exec=/opt/holdframe/bin/HoldFrame
          Icon=holdframe
          Categories=Graphics;2DGraphics;
          Terminal=false
          EOF
          cp assets/HoldFrame.png pkg/usr/share/icons/hicolor/256x256/apps/holdframe.png
          chmod 0755 pkg/DEBIAN
          dpkg-deb --root-owner-group -Zgzip -z1 --build pkg release/HoldFrame-Linux-amd64.deb
          test -s release/HoldFrame-Linux-amd64.deb
          dpkg-deb --info release/HoldFrame-Linux-amd64.deb
          dpkg-deb --contents release/HoldFrame-Linux-amd64.deb | grep -F '/opt/holdframe/bin/HoldFrame'
      - uses: actions/upload-artifact@v4
        with:
          name: HoldFrame-Linux-Installer
          path: release/HoldFrame-Linux-amd64.deb
          if-no-files-found: error
      - name: Publish native Linux Debian GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="linux-v0.12.$GITHUB_RUN_NUMBER"
          notes="HoldFrame native Linux .deb: self-contained Java runtime, desktop launcher, icon and package-manager installation. Adds Delete selected audio/pose clips, black expressive brush cursor and HFM5 pressure-aware strokes. No standalone JAR required."
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release/HoldFrame-Linux-amd64.deb --clobber
          else
            gh release create "$tag" release/HoldFrame-Linux-amd64.deb --title "HoldFrame $tag Linux DEB" --target "$GITHUB_SHA" --notes "$notes" --prerelease
          fi
      - name: Report failed Linux installer build
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create -R "$GITHUB_REPOSITORY" --title "HoldFrame native Linux installer build failed" \
            --body "Workflow: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID; commit $GITHUB_SHA" || true
