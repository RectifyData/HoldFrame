name: Complete HoldFrame v0.12.31 Windows Release

on:
  push:
    branches: [main]
    paths: [.github/workflows/backfill-v0.12.31.yml]
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  issues: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: windows
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile Windows desktop source
        id: compile
        shell: pwsh
        run: |
          Start-Transcript -Path desktop-compile.log -Force | Out-Null
          try {
            ./build.ps1
            if ($LASTEXITCODE -ne 0) { throw "Desktop source build failed, exit $LASTEXITCODE" }
            if (-not (Test-Path dist/HoldFrame.jar)) { throw "Desktop JAR missing" }
          } finally {
            Stop-Transcript | Out-Null
          }
      - name: Compile all desktop test sources
        id: testscompile
        shell: pwsh
        run: |
          Start-Transcript -Path desktop-tests-compile.log -Force | Out-Null
          try {
            New-Item -ItemType Directory -Force build/tests | Out-Null
            $tests = @(Get-ChildItem core/src/test/java/dev/rectifydata/holdframe/core -Filter *.java | ForEach-Object { $_.FullName })
            $tests += @(Get-ChildItem desktop/src/test/java/dev/rectifydata/holdframe/windows -Filter *.java | ForEach-Object { $_.FullName })
            & javac --release 17 -encoding UTF-8 -cp build/classes -d build/tests @tests
            if ($LASTEXITCODE -ne 0) { throw "Desktop tests did not compile; javac exit $LASTEXITCODE" }
          } finally {
            Stop-Transcript | Out-Null
          }
      - name: Run core regression tests
        id: coretests
        shell: pwsh
        run: |
          foreach ($test in @("CoreTest","PressureStrokeTest","ReleaseCheckerTest")) {
            Write-Host "Running $test"
            & java -cp "build/classes;build/tests" ("dev.rectifydata.holdframe.core." + $test)
            if ($LASTEXITCODE -ne 0) { throw "Core test failed: $test exit $LASTEXITCODE" }
          }
      - name: Run updater and lasso regression tests
        id: uitests
        shell: pwsh
        run: |
          foreach ($test in @("NativeInstallerUpdaterTest","LassoTest")) {
            Write-Host "Running $test"
            & java -Djava.awt.headless=true -cp "build/classes;build/tests" ("dev.rectifydata.holdframe.windows." + $test)
            if ($LASTEXITCODE -ne 0) { throw "Desktop test failed: $test exit $LASTEXITCODE" }
          }
      - name: Run media export regression tests
        id: exporttests
        shell: pwsh
        run: |
          Start-Transcript -Path desktop-export-test.log -Force | Out-Null
          try {
            & java -Djava.awt.headless=true -cp "build/classes;build/tests" dev.rectifydata.holdframe.windows.ExportSupportTest
            if ($LASTEXITCODE -ne 0) { throw "ExportSupportTest failed with exit $LASTEXITCODE" }
          } finally {
            Stop-Transcript | Out-Null
          }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate Windows icon
        id: icon
        shell: pwsh
        run: |
          python -m pip install pillow
          python tools/generate_icon.py
      - name: Create visible native EXE installer with bundled Java
        id: installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force release,build/version-meta/META-INF | Out-Null
          Set-Content build/version-meta/META-INF/holdframe-version.txt "0.12.31" -Encoding ascii
          & jar --update --file dist/HoldFrame.jar -C build/version-meta META-INF/holdframe-version.txt
          if ($LASTEXITCODE -ne 0) { throw "Version stamp failed (jar --update)" }
          if (-not (Test-Path dist/HoldFrame.jar)) { throw "Compiled HoldFrame.jar missing" }
          & jpackage --type app-image --name HoldFrame --input dist --main-jar HoldFrame.jar --main-class dev.rectifydata.holdframe.windows.HoldFrame --dest packaged --app-version "0.12.31" --vendor RectifyData --icon assets/HoldFrame.ico
          if ($LASTEXITCODE -ne 0) { throw "jpackage app-image failed, code $LASTEXITCODE" }
          if (-not (Test-Path packaged/HoldFrame/HoldFrame.exe)) { throw "jpackage launcher missing: packaged/HoldFrame/HoldFrame.exe" }
          $candidates = @(
            "${env:ProgramFiles(x86)}\NSIS\makensis.exe",
            "$env:ProgramFiles\NSIS\makensis.exe",
            "$env:ChocolateyInstall\bin\makensis.exe"
          )
          $nsis = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $nsis) {
            $command = Get-Command makensis.exe -ErrorAction SilentlyContinue
            if ($command) { $nsis = $command.Source }
          }
          if (-not $nsis) {
            Write-Host "Installing NSIS build dependency..."
            & choco install nsis -y --no-progress
            $nsis = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
            if (-not $nsis) {
              $command = Get-Command makensis.exe -ErrorAction SilentlyContinue
              if ($command) { $nsis = $command.Source }
            }
          }
          $nsisSucceeded = $false
          if ($nsis) {
            Write-Host "Building interactive NSIS setup with $nsis"
            try {
              Push-Location installers
              try {
                & $nsis windows.nsi
                $nsisCode = $LASTEXITCODE
              } finally {
                Pop-Location
              }
              if ($nsisCode -eq 0 -and (Test-Path release/HoldFrame-Setup.exe)) {
                Move-Item release/HoldFrame-Setup.exe release/HoldFrame-Windows-Setup.exe -Force
                $nsisSucceeded = $true
              } else {
                Write-Warning "NSIS error code $nsisCode or installer missing. Trying native jpackage EXE."
              }
            } catch {
              Write-Warning "NSIS failed: $_. Trying native jpackage EXE."
            }
          } else {
            Write-Warning "NSIS not found. Trying native jpackage EXE."
          }
          if (-not $nsisSucceeded) {
            & jpackage --type exe --name HoldFrame --input dist --main-jar HoldFrame.jar --main-class dev.rectifydata.holdframe.windows.HoldFrame --dest release --app-version "0.12.31" --vendor RectifyData --icon assets/HoldFrame.ico --win-dir-chooser --win-menu --win-shortcut --win-menu-group HoldFrame
            if ($LASTEXITCODE -ne 0) { throw "NSIS and jpackage EXE failed; code $LASTEXITCODE" }
            $exes = @(Get-ChildItem release -Filter '*.exe' -File)
            if ($exes.Count -ne 1) { throw "Expected one jpackage EXE, got $($exes.Count)" }
            Move-Item $exes[0].FullName release/HoldFrame-Windows-Setup.exe -Force
          }
          if (-not (Test-Path release/HoldFrame-Windows-Setup.exe)) { throw "Native setup missing" }
          $bytes = (Get-Item release/HoldFrame-Windows-Setup.exe).Length
          if ($bytes -lt 1000000) { throw "Installer too small" }
          Write-Host "Verified interactive installer: $bytes bytes"
      - uses: actions/upload-artifact@v4
        id: artifact
        with:
          name: holdframe-v0.12.31-windows-setup
          path: release/HoldFrame-Windows-Setup.exe
          if-no-files-found: error
      - name: Publish PC setup into existing Android v0.12.31 release
        id: publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.HOLDFRAME_RELEASE_TOKEN || github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $tag = "v0.12.31"
          & gh release view $tag --repo $env:GH_REPO
          if ($LASTEXITCODE -ne 0) { throw "Android release $tag does not exist" }
          $existing = @(& gh release view $tag --repo $env:GH_REPO --json assets --jq '.assets[].name')
          if ($existing -notcontains "HoldFrame-Windows-Setup.exe") {
            & gh release upload $tag release/HoldFrame-Windows-Setup.exe --repo $env:GH_REPO
            if ($LASTEXITCODE -ne 0) { throw "GitHub Windows installer publication failed" }
          }
          $all = @(& gh release view $tag --repo $env:GH_REPO --json assets --jq '.assets[].name')
          if ($all -notcontains "HoldFrame-Windows-Setup.exe" -or $all -notcontains "HoldFrame-Android12-LowRAM.apk") {
            throw "Release must contain both Android APK and Windows EXE"
          }
          & gh release download $tag --repo $env:GH_REPO --pattern "HoldFrame-Android12-LowRAM.apk" --dir release
          if ($LASTEXITCODE -ne 0) { throw "Could not download existing Android APK for checksum verification" }
          $checksums = @()
          foreach ($name in @("HoldFrame-Android12-LowRAM.apk", "HoldFrame-Windows-Setup.exe")) {
            $digest = (Get-FileHash -Algorithm SHA256 "release/$name").Hash.ToLowerInvariant()
            $checksums += "$digest  $name"
          }
          [System.IO.File]::WriteAllLines((Join-Path (Get-Location) "release/SHA256SUMS.txt"), $checksums)
          if ($all -notcontains "SHA256SUMS.txt") {
            & gh release upload $tag release/SHA256SUMS.txt --repo $env:GH_REPO
            if ($LASTEXITCODE -ne 0) { throw "Checksum upload failed" }
          }
          $oldNotes = @(& gh release view $tag --repo $env:GH_REPO --json body --jq .body) -join [Environment]::NewLine
          $header = "Windows interactive installer: HoldFrame-Windows-Setup.exe (Java runtime bundled)." +
            [Environment]::NewLine + "Android APK: HoldFrame-Android12-LowRAM.apk (original retained)." +
            [Environment]::NewLine + "Verification: SHA256SUMS.txt." +
            [Environment]::NewLine + "Desktop and Android packages were built from separate source snapshots." +
            [Environment]::NewLine + [Environment]::NewLine
          if (-not $oldNotes.Contains("Windows interactive installer: HoldFrame-Windows-Setup.exe")) {
            $notesPath = Join-Path $env:RUNNER_TEMP "holdframe-v0.12.31-notes.md"
            [System.IO.File]::WriteAllText($notesPath,$header+$oldNotes)
            & gh release edit $tag --repo $env:GH_REPO --title "[Legacy preview] HoldFrame v0.12.31 — Android and Windows" --notes-file $notesPath --prerelease
            if ($LASTEXITCODE -ne 0) { throw "Unable to update release details" }
          }
          Write-Host "Verified downloads at https://github.com/$env:GH_REPO/releases/tag/$tag"

      - name: Report failing step to GitHub Issues
        if: failure()
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $status = "Compile=${{ steps.compile.outcome }}, TestCompile=${{ steps.testscompile.outcome }}, Core=${{ steps.coretests.outcome }}, UI=${{ steps.uitests.outcome }}, Export=${{ steps.exporttests.outcome }}, Icon=${{ steps.icon.outcome }}, Installer=${{ steps.installer.outcome }}, Artifact=${{ steps.artifact.outcome }}, Publish=${{ steps.publish.outcome }}"
          Write-Host "FAILED WORKFLOW STEPS: $status"
          $runUrl = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          $body = "HoldFrame Windows v0.12.31 failed." + [Environment]::NewLine + "Run: $runUrl" + [Environment]::NewLine + "Steps: $status" + [Environment]::NewLine + "Inspect the first error in the failing step."
          foreach ($file in @("desktop-compile.log","desktop-tests-compile.log","desktop-export-test.log")) {
            if (Test-Path $file) {
              $excerpt = (Get-Content $file -Tail 65 | Out-String)
              if ($excerpt.Length -gt 7000) { $excerpt = $excerpt.Substring($excerpt.Length-7000) }
              $body += [Environment]::NewLine + "Log $file:" + [Environment]::NewLine + "~~~" + [Environment]::NewLine + $excerpt + [Environment]::NewLine + "~~~"
            }
          }
          & gh issue create --repo $env:GH_REPO --title "HoldFrame Windows v0.12.31 installer build failed" --body $body

