name: Shared core tests and prerelease
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile and test shared animation core
        run: |
          mkdir -p build/core build/test release
          javac --release 17 -d build/core core/src/main/java/dev/rectifydata/holdframe/core/*.java
          javac --release 17 -cp build/core -d build/test core/src/test/java/dev/rectifydata/holdframe/core/*.java
          java -cp build/core:build/test dev.rectifydata.holdframe.core.CoreTest
          java -cp build/core:build/test dev.rectifydata.holdframe.core.MediaCoreTest
          java -cp build/core:build/test dev.rectifydata.holdframe.core.SequenceClipboardTest
      - name: Package reusable Java library
        run: jar cf release/HoldFrame-core.jar -C build/core .
      - uses: actions/upload-artifact@v4
        with:
          name: HoldFrame-shared-core
          path: release/HoldFrame-core.jar
      - name: Publish core prerelease
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "core-v0.4.${{ github.run_number }}" release/HoldFrame-core.jar \
            --target "$GITHUB_SHA" --title "HoldFrame shared core v0.4.${{ github.run_number }}" \
            --notes "Portable HFM4 animation library with ordered multi-pose clipboard, image deduplication, editable text and audio timeline references. Prerelease." \
            --prerelease
