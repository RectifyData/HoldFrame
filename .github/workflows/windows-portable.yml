name: HoldFrame cross-platform portable prerelease
on:
  push:
    branches: [windows]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  portable:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile portable Windows/Linux JAR
        shell: pwsh
        run: ./build.ps1
      - name: Check portable JAR and package
        shell: pwsh
        run: |
          if (-not (Test-Path dist/HoldFrame.jar)) { throw "Missing desktop JAR" }
          New-Item -ItemType Directory -Force staging, release | Out-Null
          Copy-Item dist/HoldFrame.jar staging/HoldFrame.jar
          Copy-Item launch.bat staging/launch.bat
          Copy-Item README.md staging/README.md
          Copy-Item CHANGELOG.md staging/CHANGELOG.md
          Compress-Archive -Path staging/* -DestinationPath release/HoldFrame-Windows-Portable.zip -Force
          Copy-Item dist/HoldFrame.jar release/HoldFrame-cross-platform.jar
      - uses: actions/upload-artifact@v4
        with:
          name: HoldFrame-Windows-Portable
          path: release/*
      - name: Publish Windows portable GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          & gh release create "windows-portable-v0.5.${{ github.run_number }}" release/HoldFrame-Windows-Portable.zip release/HoldFrame-cross-platform.jar --target "$env:GITHUB_SHA" --title "HoldFrame Windows portable tabs/keymaps preview ${{ github.run_number }}" --notes "Portable Java 17+ desktop editor for Windows/Linux; tabs for Project, Draw, Animate, Media; configurable keyboard keymaps; timeline follow-scrolling and image/audio exports. No silent installer: double-click launch.bat or run the JAR. Native installer available only when its separate workflow passes." --prerelease
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
